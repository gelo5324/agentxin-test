#user  nobody;
worker_processes  1;
events {
    worker_connections  1024;
}


http {
    client_max_body_size 2048M;
    include       mime.types;
    default_type  application/octet-stream;
#设置最大请求数量，默认为1000，但实际的请求已经超过1000
    http2_max_requests 2000;
    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_dynamic_cache:10m max_size=10g inactive=60m use_temp_path=off;

    # 开启压缩功能
    gzip on;
    # 设置压缩级别
    gzip_comp_level 6;
    # 设置压缩类型
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    # 设置最小压缩文件大小
    gzip_min_length 1000;
    # 设置压缩缓冲区大小
    gzip_buffers 4 32k;
    # 设置压缩后数据的缓存时间
    gzip_proxied any;
    # 设置压缩比例
    gzip_vary on;
    # 过滤掉IE6等不支持压缩的浏览器
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    server {
        listen       8080;
        server_name  localhost;
        proxy_cache my_dynamic_cache;  # 缓存名称

        location / {
            root   html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;

            if ($request_filename ~* .*\.(?:htm|html)$)
            {
            add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate";
            }
        }
         location /api/hongtu/ {
            gzip_static on;
            proxy_pass http://10.1.15.212:80/;
            proxy_redirect default ;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 200s;
            proxy_read_timeout 200s;
            proxy_send_timeout 200s;

        }
        location /xinmeta/ {
            proxy_pass https://meta42-service.xinmeta.net/;
        }

        location /geoService/ {
            proxy_pass https://geo.xinproptech.com/;
        }

        location ^~ /oss/ {
            proxy_pass http://10.1.18.2:7480/;
            proxy_redirect default ;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 200s;
            proxy_read_timeout 200s;
            proxy_send_timeout 200s;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}


